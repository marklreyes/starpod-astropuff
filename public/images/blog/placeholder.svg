<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- subtle grid -->
  <g stroke="#ffffff08" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  <!-- cannabis leaf (simple 7-point) -->
  <g transform="translate(600,260)" fill="url(#leaf)" opacity="0.15">
    <path d="M0-120 C10-80 40-70 60-90 C40-50 50-20 30-10 C50-20 80-30 100-10 C70,10 60,40 80,60 C50,40 20,50 10,70 C10,50 0,30 0,10 C0,30 -10,50 -10,70 C-20,50 -50,40 -80,60 C-60,40 -70,10 -100,-10 C-80,-30 -50,-20 -30,-10 C-50,-20 -40,-50 -60,-90 C-40,-70 -10,-80 0,-120Z"/>
  </g>
  <!-- wordmark -->
  <text x="600" y="290" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">Puff Provisions</text>
  <text x="600" y="345" font-family="Georgia, serif" font-size="24" fill="#4ade80" text-anchor="middle" letter-spacing="6">BLOG</text>
  <!-- bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#4ade8018"/>
  <text x="600" y="616" font-family="system-ui, sans-serif" font-size="14" fill="#ffffff66" text-anchor="middle" letter-spacing="3">puffprovisions.com</text>
</svg>
